<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>

    <!-- Flow Gradient 1 -->
    <linearGradient id="flow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Flow Gradient 2 -->
    <linearGradient id="flow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Card/Container Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 0.2px; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    .pulse-circle { animation: pulse 3s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 12, 12; animation: dash 20s linear infinite; }
    .stream-line-fast { stroke-dasharray: 8, 8; animation: dash 10s linear infinite; }
    
    @keyframes dash {
      to {
        stroke-dashoffset: -360;
      }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 1; }
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Grid overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Dynamic / Animated Streaming Wave Lines (Background Layer) -->
  <g opacity="0.65">
    <!-- Stream wave 1 -->
    <path class="stream-line" d="M -50 240 Q 200 120 450 220 T 900 160 T 1250 260" fill="none" stroke="url(#flow1)" stroke-width="4" filter="url(#glow)"/>
    <!-- Stream wave 2 -->
    <path class="stream-line-fast" d="M -50 100 Q 300 280 600 130 T 1050 210 T 1250 110" fill="none" stroke="url(#flow2)" stroke-width="3.5"/>
  </g>

  <!-- Glowing Nodes representing real-time event streams -->
  <g opacity="0.8">
    <circle cx="250" cy="190" r="6" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="150" r="5" fill="#f43f5e" filter="url(#glow)">
      <animate attributeName="r" values="3;7;3" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="180" r="7" fill="#10b981" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="210" r="5" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="3.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Content Container Card to guarantee text legibility -->
  <rect x="60" y="45" width="1080" height="230" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#glow)" opacity="0.95"/>

  <!-- Top Category Tag/Pill -->
  <g transform="translate(95, 75)">
    <rect width="250" height="30" rx="15" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#38bdf8"/>
    <text x="28" y="20" class="badge-text">REAL-TIME STREAMING ECOSYSTEM</text>
  </g>

  <!-- Title & Subtitle (Always in Foreground) -->
  <text x="95" y="150" class="title">Awesome Real-Time Stream Analytics</text>
  <text x="95" y="192" class="subtitle">A curated landscape of SaaS Platforms &amp; Open-Source Event Stream Processing Engines</text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(95, 222)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui" font-size="12" fill="#cbd5e1" font-weight="500">⚡ Low Latency ETL</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(192, 0)">
      <rect width="210" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui" font-size="12" fill="#cbd5e1" font-weight="500">🔄 Complex Event Processing</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(414, 0)">
      <rect width="170" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui" font-size="12" fill="#cbd5e1" font-weight="500">📊 Streaming SQL</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(596, 0)">
      <rect width="160" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui" font-size="12" fill="#cbd5e1" font-weight="500">🌐 Stateful Processing</text>
    </g>
  </g>
</svg>
